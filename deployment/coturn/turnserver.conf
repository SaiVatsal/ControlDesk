# ControlDesk coturn TURN/STUN Server Configuration
# High-performance, cross-border traversal (India <-> Dubai)

# Listening ports
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External IP (Set via command-line or replace with VPS Public IP)
# external-ip=YOUR_PUBLIC_IP

# Min/Max relay ports for UDP media streaming
min-port=49152
max-port=65535

# Fingerprint in TURN messages (required for WebRTC RFC 5766)
fingerprint

# Long-term credential mechanism for WebRTC
lt-cred-mech

# Realm domain (must match Turn:Domain in signaling server)
realm=turn.controldesk.internal

# Shared secret for REST API ephemeral credentials (must match Turn:Secret in signaling server)
static-auth-secret=ControlDeskTurnSecret2026ChangeInProduction

# Enable STUN/TURN over UDP and TCP
no-stdout-log
log-file=stdout

# Security: do not allow localhost relays
no-loopback-peers
no-multicast-peers

# Performance tuning
mobility
keep-alive=30
max-allocate-per-user=10
total-quota=1000
bps-capacity=0
stale-nonce=600
